name: Independent cable compatibility
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/HiFiCableAsioBridgeSetup_v1007.zip -OutFile hifi.zip -TimeoutSec 60
          if ((Get-FileHash hifi.zip).Hash -ne '3ecf204bfd8579d36bb918f9856eb1eaddd49c75146f5e8a8f59dcb8375ae89a') { throw 'Checksum' }
          Expand-Archive hifi.zip hifi
          $p = Start-Process ./hifi/HiFiCableAsioBridgeSetup.exe -PassThru
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class View {
            public delegate bool Each(IntPtr h,IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(Each f,IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h,Each f,IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint p);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder s,int n);
            [DllImport("user32.dll")] public static extern int GetDlgCtrlID(IntPtr h);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out Rect r);
            [StructLayout(LayoutKind.Sequential)] public struct Rect {public int L,T,R,B;}
          }
          '@
          $id = $p.Id
          [View]::EnumWindows({param($h,$l)
            [uint32]$ownerId=0
            [void][View]::GetWindowThreadProcessId($h,[ref]$ownerId)
            if ($ownerId -eq $id) {
              $text = [Text.StringBuilder]::new(512)
              [void][View]::GetWindowText($h,$text,512)
              Write-Host "Window $h $text"
              [View]::EnumChildWindows($h,{param($child,$param)
                $caption = [Text.StringBuilder]::new(512)
                [void][View]::GetWindowText($child,$caption,512)
                Write-Host "Child $child ID=$([View]::GetDlgCtrlID($child)) $caption"
                return $true
              },[IntPtr]::Zero)
              $r=[View+Rect]::new()
              [void][View]::GetWindowRect($h,[ref]$r)
              if ($r.R-$r.L -gt 100 -and $r.B-$r.T -gt 100) {
                $img=[Drawing.Bitmap]::new($r.R-$r.L,$r.B-$r.T)
                $g=[Drawing.Graphics]::FromImage($img)
                $dc=$g.GetHdc()
                [void][View]::PrintWindow($h,$dc,2)
                $g.ReleaseHdc($dc)
                $img.Save("$pwd/hifi.png")
                $g.Dispose();$img.Dispose()
              }
            }
            return $true
          },[IntPtr]::Zero)
          $p.Refresh()
          $h=$p.MainWindowHandle
          if ($h -eq [IntPtr]::Zero) { throw 'Installer window not found' }
          # Coordinates observed in the original installer image: Install.
          [void][View]::PostMessage($h,0x201,[IntPtr]1,[IntPtr]((475 -shl 16) -bor 730))
          [void][View]::PostMessage($h,0x202,[IntPtr]::Zero,[IntPtr]((475 -shl 16) -bor 730))
          Start-Sleep -Seconds 8
          $files=Get-ChildItem 'C:/Program Files','C:/Program Files (x86)' -Filter '*hfvaio*' -Recurse -ErrorAction SilentlyContinue
          foreach ($f in $files) { Write-Host $f.FullName; if ($f.Extension -eq '.inf') { Get-Content $f.FullName } }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($f in $files | Where-Object Name -eq 'vbaudio_hfvaio64_win7.sys') {
            $cat=Join-Path $f.DirectoryName vbaudio_hfvaio64_win7.cat
            signtool verify /kp /v /c $cat $f.FullName
            if ($LASTEXITCODE) { throw 'Hi-Fi Cable production signature check failed' }
          }
          if (-not $files) { throw 'Vendor installer did not extract driver files' }
      - uses: actions/upload-artifact@v4
        with:
          name: hifi-probe
          path: hifi.png
