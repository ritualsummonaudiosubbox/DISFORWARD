name: Windows app build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(PATH|INCLUDE|LIB|LIBPATH|VC.*|VS.*|WindowsSDK.*|WindowsSdk.*|WindowsLibPath|UniversalCRT.*|UCRT.*|VisualStudioVersion|Framework.*|NETFXSDKDir)$' } | ForEach-Object { "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
      - name: Source and routing tests
        shell: pwsh
        run: |
          python tests/check_source.py
          if ($LASTEXITCODE) { throw 'Source check failed' }
          foreach ($test in @('audio_core_test','route_devices_test')) {
            cl /nologo /std:c++17 /EHsc /W4 /WX "tests/$test.cpp" "/Fe:$test.exe"
            if ($LASTEXITCODE) { throw "$test build failed" }
            & "./$test.exe"
            if ($LASTEXITCODE) { throw "$test failed" }
          }
      - name: Build console and bundled vendor setup
        shell: pwsh
        run: ./build-windows.ps1
      - name: Windows UI smoke test
        shell: pwsh
        run: ./tests/windows-ui-smoke.ps1 -Exe ./artifacts/DISFORWARD-Windows-x64/DISFORWARD.exe -Screenshot "${{ github.workspace }}/artifacts/DISFORWARD-Windows-x64/UI-preview.png"
      - name: Verify Microsoft-signed driver package
        shell: pwsh
        run: |
          Expand-Archive third_party/VBCABLE_Driver_Pack45.zip -DestinationPath third_party/VB-CABLE -Force
          signtool verify /kp /v /c third_party/VB-CABLE/vbaudio_cable64_win10.cat third_party/VB-CABLE/vbaudio_cable64_win10.sys
          if ($LASTEXITCODE) { throw 'Vendor kernel driver signature verification failed' }
      - name: Build audio integration probes
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /utf-8 /EHsc /W4 /WX /DUNICODE /D_UNICODE tests/install-vbcable-ci.cpp /Fe:install-vbcable-ci.exe /link setupapi.lib newdev.lib
          if ($LASTEXITCODE) { throw 'Install probe build failed' }
          cl /nologo /std:c++17 /utf-8 /EHsc /W4 /WX /DUNICODE /D_UNICODE /DDISFORWARD_AUDIO_TEST tests/windows-audio-probe.cpp app/engine.cpp app/diagnostics.cpp /Fe:windows-audio-probe.exe /link ole32.lib uuid.lib mmdevapi.lib avrt.lib user32.lib
          if ($LASTEXITCODE) { throw 'Audio probe build failed' }
      - name: Signed driver and live audio on disposable runner
        id: live_audio
        shell: pwsh
        run: |
          $report = "${{ github.workspace }}/artifacts/DISFORWARD-Windows-x64/WINDOWS-AUDIO-CHECK.txt"
          "Windows runner audio integration check. This is not a Discord/call-app test." | Set-Content $report
          Set-Service AudioEndpointBuilder -StartupType Manual
          Set-Service Audiosrv -StartupType Manual
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          # Explicit recording consent for generated tones on this disposable runner.
          # No physical microphone or user audio is present or requested here.
          foreach ($hive in @('HKCU:','HKLM:')) {
            $key = "$hive\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value Allow
            New-Item -Path "$key\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path "$key\NonPackaged" -Name Value -Value Allow
          }
          ./install-vbcable-ci.exe (Resolve-Path third_party/VB-CABLE/vbMmeCable64_win10.inf) 2>&1 | Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE) { throw 'Vendor driver installation failed on runner' }
          ./windows-audio-probe.exe 2>&1 | Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE) { throw 'Live audio probe failed on runner' }
      - name: Record live audio outcome
        if: always()
        shell: pwsh
        run: |
          $report = "${{ github.workspace }}/artifacts/DISFORWARD-Windows-x64/WINDOWS-AUDIO-CHECK.txt"
          if (Test-Path (Split-Path $report)) { "GitHub runner integration outcome: ${{ steps.live_audio.outcome }}" | Add-Content $report }
      - uses: actions/upload-artifact@v4
        with:
          name: DISFORWARD-Windows-x64
          path: artifacts/DISFORWARD-Windows-x64
          if-no-files-found: error
